<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEngine | Client-Side Automation Tool</title>
    <!-- Tailwind CSS untuk styling modern dan responsif -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                <h1 class="font-bold text-lg tracking-wider text-white">NEXUS<span class="text-emerald-400">ENGINE</span></h1>
            </div>
            <span class="text-xs code-font bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">v1.0.0-beta // Client-Side</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        
        <!-- Panel Input -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-[500px]">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center justify-between">
                <span>1. Raw Data Input</span>
                <span id="input-stats" class="text-xs text-slate-500 code-font">0 chars</span>
            </h2>
            <textarea id="raw-input" class="flex-grow bg-slate-950 border border-slate-800 rounded-xl p-4 code-font text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition resize-none" placeholder="Masukkan teks mentah di sini untuk diproses secara otomatis..."></textarea>
            
            <div class="mt-4 flex gap-3">
                <button onclick="EngineController.processData('uppercase')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-emerald-950/50 cursor-pointer">
                    UPPERCASE
                </button>
                <button onclick="EngineController.processData('slugify')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 px-4 rounded-xl text-sm transition border border-slate-700 cursor-pointer">
                    Slugify URL
                </button>
                <button onclick="EngineController.clearAll()" class="bg-red-950/40 hover:bg-red-900/50 text-red-400 font-medium py-2.5 px-4 rounded-xl text-sm transition border border-red-900/50 cursor-pointer">
                    Reset
                </button>
            </div>
        </section>

        <!-- Panel Output -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-[500px]">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center justify-between">
                <span>2. Automated Output</span>
                <button onclick="EngineController.copyOutput()" class="text-xs text-emerald-400 hover:text-emerald-300 transition cursor-pointer">Salin Hasil</button>
            </h2>
            <div id="output-display" class="flex-grow bg-slate-950 border border-slate-800 rounded-xl p-4 code-font text-sm text-emerald-400 overflow-y-auto whitespace-pre-wrap select-all">Hasil otomatisasi akan muncul di sini secara real-time...</div>
            
            <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span>Eksekusi: <strong id="execution-time" class="text-slate-200">0 ms</strong></span>
                <span class="text-emerald-500 font-medium">100% Client-Side Secure</span>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        NexusEngine &mdash; Dirancang khusus untuk efisiensi otomatisasi web modern.
    </footer>

    <!-- Core JavaScript Logic -->
    <script>
        class TextAutomationEngine {
            // Fungsi murni untuk transformasi data
            static toUppercase(text) {
                return text.toUpperCase();
            }

            static toSlug(text) {
                return text
                    .toLowerCase()
                    .trim()
                    .replace(/[^\w\s-]/g, '')
                    .replace(/[\s_-]+/g, '-')
                    .replace(/^-+|-+$/g, '');
            }
        }

        class EngineController {
            static processData(action) {
                const startTime = performance.now();
                const inputElement = document.getElementById('raw-input');
                const outputElement = document.getElementById('output-display');
                const timeElement = document.getElementById('execution-time');
                
                const text = inputElement.value;
                if (!text.trim()) {
                    outputElement.textContent = "Peringatan: Input data masih kosong!";
                    return;
                }

                let result = "";
                if (action === 'uppercase') {
                    result = TextAutomationEngine.toUppercase(text);
                } else if (action === 'slugify') {
                    result = TextAutomationEngine.toSlug(text);
                }

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                outputElement.textContent = result;
                timeElement.textContent = `${duration} ms`;
            }

            static clearAll() {
                document.getElementById('raw-input').value = '';
                document.getElementById('output-display').textContent = 'Hasil otomatisasi akan muncul di sini secara real-time...';
                document.getElementById('input-stats').textContent = '0 chars';
                document.getElementById('execution-time').textContent = '0 ms';
            }

            static copyOutput() {
                const outputText = document.getElementById('output-display').textContent;
                navigator.clipboard.writeText(outputText);
                alert('Berhasil menyalin hasil ke clipboard!');
            }
        }

        // Event Listener untuk statistik input real-time
        document.getElementById('raw-input').addEventListener('input', (e) => {
            const count = e.target.value.length;
            document.getElementById('input-stats').textContent = `${count} chars`;
        });
    </script>
</body>
</html>
